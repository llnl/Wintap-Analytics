[project]
name = "wintap-acme4-annotations"
version = "0.1.0"
description = "ACME4 annotation utilities (Caldera ingest/exploration/report generation)."
readme = "README-Labels.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dlt>=1.4",
  "duckdb>=0.10",
  "matplotlib>=3.8",
  "mdutils>=1.6",
  "networkx>=3",
  "pandas>=2",
  "streamlit>=1.34",
]

[tool.uv]
# Keep lockfiles and environments scoped to this subproject.
package = false
